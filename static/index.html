<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>myTeam</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{color-scheme:light;--bg:#f6f7f9;--sf:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d9dde3;--ac:#3b5bdb;--ac2:#e7ecff;--ok:#2b8a3e;--wa:#e8590c;--er:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--sf:#1d2128;--tx:#e8eaed;--mu:#9aa3b0;--bd:#323944;--ac:#7c93ff;--ac2:#273055;--ok:#69db7c;--wa:#ffa94d;--er:#ff8787}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--sf:#1d2128;--tx:#e8eaed;--mu:#9aa3b0;--bd:#323944;--ac:#7c93ff;--ac2:#273055;--ok:#69db7c;--wa:#ffa94d;--er:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--sf);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
nav h1{font-size:15px;margin:0 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}nav h1 .logo{width:150px;max-width:100%;height:auto}nav .sec{font-size:11px;color:var(--mu);text-transform:uppercase;margin:12px 8px 2px}
nav button{text-align:left;border:0;background:none;color:var(--tx);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{flex:1;padding:20px;min-width:0;overflow-x:auto}
h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 8px;font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--mu);padding:8px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
button.b,.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.g{background:none;color:var(--ac);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button.d{color:var(--er)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}textarea{resize:vertical;min-height:38px}.drop.drag textarea{outline:2px dashed var(--ac);background:var(--ac2)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips:not(:empty){margin-bottom:6px}.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--bd);border-radius:12px;font-size:12px;background:var(--sf)}.chip button{border:0;background:none;padding:0 2px;cursor:pointer;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row input{width:auto;flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mu)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--ac2);color:var(--ac)}
.tag.ok{color:var(--ok)}.tag.wa{color:var(--wa)}.tag.er{color:var(--er)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.task{margin-left:0;border-left:2px solid var(--bd);padding-left:10px;margin-top:6px}
.tr{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;flex-wrap:wrap}.tr .t{flex:1;min-width:140px}.tr select{width:auto}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#mod>div{background:var(--sf);border-radius:12px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
#mod label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
#login{max-width:340px;margin:12vh auto;padding:0 16px}#login .card{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
@media(max-width:700px){#app{flex-direction:column}nav{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--bd)}nav .sec{display:none}}
</style></head><body>
<div id="root"></div><div id="mod"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


let D=null,U=null,TOK=null,view="dash",pid=null,tab="glob",q="",err="";
try{TOK=localStorage.getItem("apm_tok");U=localStorage.getItem("apm_user")}catch(e){}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:Object.assign({"Content-Type":"application/json"},TOK?{Authorization:"Bearer "+TOK}:{}),body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||r.statusText);e.status=r.status;e.data=j;throw e}return j}
async function loadState(){const r=await api("GET","/api/state");REV=r.rev;SER=r.ser;DEFCAPS=r.defcaps||DEFCAPS;DEFBASE=r.defbase||DEFBASE;const d=r.state;if(!d||!d.projects)return fresh();let mg=ensureG(d);d.projects.forEach(ensure);(d.services||[]).forEach(s=>{if(s.model=="gemini-2.0-flash"){s.model="gemini-3.8-flash";mg=true}});if(mg)setTimeout(save,0);return d}
const uid=()=>Math.random().toString(36).slice(2,9);
let st=null,ver=0,REV=0,SER=0,saving=false;
const modalOpen=()=>$("#mod").style.display=="flex";
function adopt(r){REV=r.rev;SER=r.ser;if(JSON.stringify(r.state)!=JSON.stringify(D)){D=r.state;const cg=ensureG(D);D.projects.forEach(ensure);render();if(cg)setTimeout(save,0)}}
async function put(){const v=ver;saving=true;try{const r=await api("PUT","/api/state",{rev:REV,state:D});if(v==ver&&!modalOpen())adopt(r)}catch(e){if(e.status==401)logout()}saving=false}
function save(){ver++;clearTimeout(st);st=setTimeout(()=>{st=null;put()},300)}
async function flush(){clearTimeout(st);st=null;await put()}
async function poll(){if(!TOK||!D||st||saving||modalOpen())return;const v=ver;try{const r=await api("GET","/api/state?ser="+SER);if(r.same||st||saving||v!=ver||modalOpen())return;REV=r.rev;SER=r.ser;D=r.state;D.projects.forEach(ensure);render()}catch(e){if(e.status==401)logout()}}
setInterval(poll,2000);
async function job(o){try{await flush();await api("POST","/api/job",Object.assign({projectId:pid},o));setTimeout(poll,500)}catch(e){alert(e.message)}}

const CAPS=[["subtask","Créer des sous-tâches (sous ses propres tâches)","sous-tâches"],["task_top","Créer des tâches de 1er niveau","1er niveau"],["module","Créer des modules","modules"],["bug","Déclarer des bugs","bugs"],["bug_update","Faire évoluer les bugs (en correction, corrigé)","évolution bugs"],["bug_verify","Vérifier / rouvrir un bug","vérification"],["mr_review","Valider les merge requests des autres agents","validation MR"],["link","Rattacher aux modules","liens modules"],["check","Proposer des contrôles automatiques (toujours soumis à votre approbation)","contrôles"]];
const LV={free:"✔ libre",approve:"✋ soumis à validation",no:"— interdit"},AUT={prudent:"Prudent",balanced:"Équilibré",auto:"Autonome"};
let DEFCAPS={},DEFBASE={};function defCaps(n){return{...(DEFCAPS[n]||DEFBASE)}}  // défauts des droits : servis par le serveur avec l’état (rights.DEFAULT_CAPS)
const SUBJ=[["langue","Langue et style des réponses"],["ambiguite","Ambiguïté, décisions et erreurs"],["interruption","Interruptions et reprise de la tâche"],["coordination","Coordination entre agents"],["fichier_contexte","Fichier de contexte de l’agent"],["fichiers","Lecture et écriture des fichiers"]];  // sujets des règles par défaut remplaçables : à garder synchronisé avec rulebook.SUBJECTS
const NAMES=["Camille","Louis","Inès","Hugo","Jade","Noah","Léna","Adam","Zoé","Théo","Maëlle","Axel","Éva","Malo","Lucie","Nils"];
const ROLES=[["Chef de projet","Planifie, priorise, coordonne l’équipe et rend compte de l’avancement."],["Architecte","Définit l’architecture technique et les standards de code."],["Développeur back-end","Implémente la logique métier, les API et la base de données."],["Développeur front-end","Réalise l’interface et l’expérience utilisateur."],["Testeur QA","Rédige et exécute les tests, qualifie et remonte les bugs."],["DevOps","Gère l’intégration continue, le déploiement et l’infrastructure."],["Rédacteur technique","Rédige la documentation et les notes de version."]];
const SERV=[["Claude","https://api.anthropic.com/v1","Raisonnement, code long, respect des consignes","Quota de tokens à surveiller","anthropic","claude-sonnet-4-6"],["Mistral","https://api.mistral.ai/v1","Rapide, bon en français, coût maîtrisé","Moins solide sur les très gros contextes","openai","mistral-small-latest"],["ChatGPT","https://api.openai.com/v1","Polyvalent, large écosystème d’outils","Verbosité, coût variable","openai","gpt-4o"],["Gemini","https://generativelanguage.googleapis.com/v1beta/openai","Très grand contexte, multimodal","Régularité variable sur le code","openai","gemini-3.8-flash"],["Gemini-free","https://generativelanguage.googleapis.com/v1beta/openai","Offre gratuite via AI Studio, très grand contexte","Quotas et débit limités","openai","gemini-3.8-flash"],["DeepSeek","https://api.deepseek.com","Excellent rapport qualité/prix en code","Disponibilité parfois limitée","openai","deepseek-chat"]];
function fresh(){return{roles:ROLES.map(r=>({id:uid(),name:r[0],desc:r[1],caps:defCaps(r[0])})),services:SERV.map(s=>({id:uid(),name:s[0],url:s[1],account:"",pros:s[2],cons:s[3],kind:s[4],model:s[5],apiKey:""})),projects:[]}}
function newProject(name){return{id:uid(),name,open:true,desc:"",rules:"",spec:"",mainId:"",localdir:"",repo:{url:"",branch:"main",token:""},autonomy:"balanced",agents:[],tasks:[],bugs:[],modules:[],log:[],commits:[],releases:[],mrs:[]}}
function ensureG(d){let ch=false;if(!Array.isArray(d.roles)){const m=[];(d.projects||[]).forEach(p=>(p.roles||[]).forEach(r=>{if(!m.some(x=>x.name==r.name))m.push(r)}));d.roles=m.length?m:ROLES.map(r=>({id:uid(),name:r[0],desc:r[1],caps:defCaps(r[0])}));ch=true}(d.projects||[]).forEach(p=>{if(p.roles){delete p.roles;ch=true}});d.roles.forEach(r=>{if(!r.caps){r.caps=defCaps(r.name);ch=true}});return ch}
function ensure(p){p.repo=Object.assign({url:"",branch:"main",token:""},p.repo||{});["agents","tasks","bugs","modules","log","commits","releases","mrs"].forEach(k=>{p[k]=p[k]||[]});p.rules=p.rules||"";p.spec=p.spec||"";p.workflows=p.workflows||[];p.autonomy=p.autonomy||"balanced";p.localdir=p.localdir||"";p.agents.forEach(a=>{a.source=a.source||"github"});
  p.agents.forEach(a=>{if(a.token&&!p.repo.token)p.repo.token=a.token;if(a.repo&&!p.repo.url)p.repo.url=a.repo;delete a.token;delete a.repo;delete a.dir;a.history=a.history||[];a.notes=a.notes||"";a.talk=a.talk||[];a.branch=a.branch||"agent/"+a.name.toLowerCase()});
  if(!p.mainId&&p.agents[0])p.mainId=p.agents[0].id;p.tasks.forEach(t=>{t.modules=t.modules||[]});p.bugs.forEach(b=>{b.modules=b.modules||[]})}
const P=()=>D.projects.find(p=>p.id===pid);
const ag=(p,id)=>p.agents.find(a=>a.id===id);
function prog(p){const t=p.tasks.length;return t?Math.round(100*p.tasks.filter(x=>x.status==="terminée").length/t):0}
function modal(title,fields,cb,okLabel){
  const h=fields.map(f=>f.info?`<div class="mu" style="margin-top:8px">${f.info}</div>`:f.check?`<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input data-k="${f.k}" type="checkbox"${f.v?" checked":""}> ${esc(f.l)}</label>`:`<label>${esc(f.l)}</label>`+(f.opts?`<select data-k="${f.k}"${f.multi?" multiple size=4":""}>${f.opts.map(o=>`<option value="${esc(o[0])}"${(f.multi?(f.v||[]).includes(o[0]):o[0]==f.v)?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`:f.area?`<textarea data-k="${f.k}" rows="${f.rows||3}">${esc(f.v||"")}</textarea>`:`<input data-k="${f.k}" type="${f.type||"text"}" value="${esc(f.v||"")}">`)).join("");
  $("#mb").innerHTML=`<h3 style="margin-top:0">${esc(title)}</h3>${h}<div class="row" style="margin:16px 0 0;justify-content:flex-end"><button class="g" id="mc">Annuler</button><button class="b" id="mo">${okLabel||"Valider"}</button></div>`;
  $("#mod").style.display="flex";
  $("#mc").onclick=()=>$("#mod").style.display="none";
  $("#mo").onclick=()=>{const o={};document.querySelectorAll("#mb [data-k]").forEach(e=>o[e.dataset.k]=e.type=="checkbox"?e.checked:e.multiple?[...e.selectedOptions].map(x=>x.value):e.value);$("#mod").style.display="none";cb(o);save();render()};
}
function login(){
  $("#root").innerHTML=`<div id="login"><div class="card"><img class="logo" src="/logo-myteam.png" alt="myTeam logo" style="align-self:center;width:150px"><h2 style="margin:0;text-align:center">myTeam</h2><span class="mu">Connectez-vous ou créez un compte (les données restent sur cet appareil).</span><input id="u" placeholder="Identifiant" autocomplete="username"><input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password"><div style="color:var(--er)">${esc(err)}</div><button class="b" id="in">Connexion</button><button class="g" id="cr">Créer le compte</button></div></div>`;
  const go=async mk=>{const u=$("#u").value.trim(),p=$("#p").value;if(!u||!p){err="Identifiant et mot de passe requis.";return login()}
    try{const r=await api("POST",mk?"/api/register":"/api/login",{user:u,password:p});TOK=r.token;U=u;try{localStorage.setItem("apm_tok",TOK);localStorage.setItem("apm_user",U)}catch(e){}D=await loadState();if(mk)save();err="";render()}catch(e){err=e.message;login()}};
  $("#in").onclick=()=>go(false);$("#cr").onclick=()=>go(true);
}
function logout(){clearTimeout(st);api("POST","/api/logout").catch(()=>{});TOK=U=D=null;pid=null;view="dash";try{localStorage.removeItem("apm_tok");localStorage.removeItem("apm_user")}catch(e){}login()}
function render(){
  if(!U)return login();
  const open=D.projects.filter(p=>p.open);
  let nav=`<nav><h1><img class="logo" src="/logo-myteam.png" alt="myTeam logo"><span>myTeam</span></h1><button data-v="dash" class="${view=="dash"?"on":""}">Tableau de bord</button><button data-v="proj" class="${view=="proj"?"on":""}">Projets</button><button data-v="serv" class="${view=="serv"?"on":""}">Services IA</button><button data-v="roles" class="${view=="roles"?"on":""}">Rôles</button><button data-v="skills" class="${view=="skills"?"on":""}">Skills${skPend()?` <span class="tag wa">${skPend()}</span>`:""}</button><div class="sec">Projets ouverts</div>`+open.map(p=>`<button data-p="${p.id}" class="${view=="p"&&pid==p.id?"on":""}">${esc(p.name)}${pendN(p)+(p.pending||[]).length?` <span class="tag wa">${pendN(p)+(p.pending||[]).length}</span>`:""}</button>`).join("")+`<div style="flex:1"></div><span class="mu" style="padding:0 8px">${esc(U)}</span><button id="lo">Déconnexion</button></nav>`;
  let body=view=="dash"?dash():view=="proj"?projects():view=="serv"?services():view=="roles"?rolesView():view=="skills"?skillsView():projView();
  const keep={},ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart;document.querySelectorAll("[data-keep]").forEach(e=>{keep[e.id]=e.value});const sc={};document.querySelectorAll("[data-scroll]").forEach(e=>{sc[e.id]={t:e.scrollTop,b:e.scrollHeight-e.scrollTop-e.clientHeight<40}});
  $("#root").innerHTML=`<div id="app">${nav}<main>${body}</main></div>`;
  Object.keys(keep).forEach(i=>{const e=document.getElementById(i);if(e)e.value=keep[i]});document.querySelectorAll("[data-scroll]").forEach(e=>{const o=sc[e.id];e.scrollTop=(!o||o.b)?e.scrollHeight:o.t});const fe=fid&&document.getElementById(fid);if(fe){fe.focus();try{if(fs!=null)fe.setSelectionRange(fs,fs)}catch(e){}}
  document.querySelectorAll("nav [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  document.querySelectorAll("nav [data-p]").forEach(b=>b.onclick=()=>{pid=b.dataset.p;view="p";tab="glob";render()});
  $("#lo").onclick=logout;bind();if(view=="skills")skBind();skBoot();
}
function bind(){document.querySelectorAll("main [data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i,b.dataset.j));
  document.querySelectorAll("main [data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  document.querySelectorAll("main select[data-s]").forEach(s=>s.onchange=()=>{const p=P();const t=p.tasks.find(x=>x.id==s.dataset.i)||p.bugs.find(x=>x.id==s.dataset.i);t[s.dataset.s]=s.value;save();render()});
  ["ci","gi"].forEach(i=>{const e=$("#"+i);if(e){const w=$("#"+i+"-w"),fi=$("#"+i+"-f"),pk=document.querySelector(`[data-pick="${i}"]`);chips(i);w.ondragover=ev=>{if([...ev.dataTransfer.types].includes("Files")){ev.preventDefault();w.classList.add("drag")}};w.ondragleave=ev=>{if(!w.contains(ev.relatedTarget))w.classList.remove("drag")};w.ondrop=ev=>{w.classList.remove("drag");if(ev.dataTransfer.files.length){ev.preventDefault();addFiles(i,[...ev.dataTransfer.files])}};e.onpaste=ev=>{const fl=[...(ev.clipboardData?ev.clipboardData.files:[])];if(fl.length){ev.preventDefault();addFiles(i,fl)}};pk.onclick=()=>fi.click();fi.onchange=()=>{addFiles(i,[...fi.files]);fi.value=""};const fit=()=>{e.style.height="auto";e.style.height=Math.min(e.scrollHeight+2,260)+"px"};e.oninput=fit;fit();e.onkeydown=ev=>{if(ev.key=="Enter"&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();const b=document.querySelector(`[data-j="${i}"]`);if(b)b.click()}}}});const s=$("#sq");if(s)s.oninput=()=>{q=s.value;render();const n=$("#sq");n.focus();n.setSelectionRange(q.length,q.length)}}
function dash(){
  const open=D.projects.filter(p=>p.open);
  const ags=open.reduce((n,p)=>n+p.agents.length,0),bugs=open.reduce((n,p)=>n+p.bugs.filter(b=>bugOpen(b)).length,0),susp=open.reduce((n,p)=>n+p.agents.filter(a=>a.state=="suspendu").length,0);
  return `<h2>Tableau de bord</h2><div class="grid" style="margin-bottom:18px"><div class="card"><div class="big">${open.length}</div><div class="mu">projets ouverts</div></div><div class="card"><div class="big">${ags}</div><div class="mu">agents actifs (dont ${susp} suspendus)</div></div><div class="card"><div class="big">${bugs}</div><div class="mu">bugs non résolus</div></div><div class="card"><div class="big">${D.services.length}</div><div class="mu">services IA</div></div><div class="card"><div class="big">${fmt$(open.reduce((n,p)=>n+((p.usage||{}).cost||0),0))}</div><div class="mu">coût API estimé (projets ouverts)</div></div><div class="card"><div class="big">${open.reduce((n,p)=>n+pendN(p),0)}</div><div class="mu">décisions en attente</div></div></div>`+(open.length?`<div class="grid">`+open.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="bar"><i style="width:${prog(p)}%"></i></div><div class="mu">${prog(p)} % · ${p.tasks.length} tâches · ${p.agents.length} agents · ${p.bugs.filter(b=>bugOpen(b)).length} bugs · ${p.releases.length} releases</div><div style="margin-top:8px"><button class="g" data-a="go" data-i="${p.id}">Ouvrir</button></div></div>`).join("")+`</div>`:`<div class="card">Aucun projet ouvert. Créez-en un dans l’onglet Projets.</div>`);
}
function projects(){
  const l=D.projects.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));

function rolesView(){
  return `<h2>Rôles</h2><div class="mu" style="margin-bottom:10px">Les rôles sont définis une seule fois, ici, et réutilisables dans tous les projets.</div><div class="row"><button class="b" data-a="newr">Nouveau rôle</button></div><table><tr><th>Rôle</th><th>Description</th><th>Droits des agents</th><th>Utilisé par</th><th></th></tr>`+D.roles.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.desc)}</td><td class="mu">${CAPS.map(c=>c[2]+" "+({free:"✔",approve:"✋",no:"—"}[(r.caps||DEFBASE)[c[0]]||"no"])).join(" · ")}</td><td class="mu">${D.projects.reduce((c,q)=>c+q.agents.filter(x=>x.role==r.id).length,0)} agent(s)</td><td><button class="g" data-a="editr" data-i="${r.id}">Modifier</button> <button class="g d" data-a="delr" data-i="${r.id}">Supprimer</button></td></tr>`).join("")+`</table><div class="mu" style="margin-top:8px">✔ libre · ✋ soumis à votre validation · — interdit. Le niveau d’autonomie de chaque projet (Vue globale) peut durcir ou assouplir ces droits.</div>`;
}

/* ---------- Skills (niveau application) : données côté serveur (data/skills/<utilisateur>), jamais dans l'état partagé ---------- */
let SK={items:[],facets:{},loaded:false,loading:false,upd:{},msg:""},SKF={q:"",domain:"",subdomain:"",language:"",functional:"",state:""};
const SKDOM={coding:"Développement",devops:"DevOps",data:"Données",docs:"Documentation",security:"Sécurité",design:"Design",product:"Produit",writing:"Rédaction",ai:"IA / agents",general:"Général"};
const SKSUB={backend:"back-end",frontend:"front-end",integration:"intégration",database:"base de données",infra:"infrastructure",testing:"tests",review:"relecture",architecture:"architecture",performance:"performance",mobile:"mobile",git:"git",scripting:"scripts","ci-cd":"CI/CD"};
const skDom=k=>SKDOM[k]||(k?k:"Non classé"),skSub=k=>SKSUB[k]||k;
const skArr=v=>Array.isArray(v)?v:(v?[v]:[]);
const skFormat={skill:"skill",command:"commande",rule:"règle"};
const skSrc=s=>{const o=s.source||{};return o.type=="git"?"dépôt "+o.repo+(o.path&&o.path!="."?" / "+o.path:""):"fichier "+(o.name||"")};
const skPend=()=>SK.items.filter(s=>s.review=="pending").length;
function skBoot(){if(!SK.loaded&&!SK.loading&&TOK)setTimeout(skLoad,0);if(!SK.t)SK.t=setInterval(async()=>{if(!TOK||$("#mod").style.display=="flex")return;try{const r=await api("GET","/api/skills");if(JSON.stringify(r.items)!=JSON.stringify(SK.items)){SK.items=r.items;SK.facets=r.facets;render()}}catch(e){}},15000)}
const skName=(list,id)=>((list||[]).find(x=>x.id==id)||{}).name||id;
const skScopeTxt=s=>{const sc=s.scope||{},pr=(sc.projects||[]).map(i=>skName(D.projects,i)),ro=(sc.roles||[]).map(i=>skName(D.roles,i)),rq=(s.required_roles||[]).map(i=>skName(D.roles,i));return (pr.length?"projets : "+pr.join(", "):"tous les projets")+" · "+(ro.length?"rôles : "+ro.join(", "):"tous les rôles")+(rq.length?" · <b>imposée à : "+esc(rq.join(", "))+"</b>":"")};
const skUsage=s=>{const u=s.usage||{};return u.reads?`lue ${u.reads}× par les agents · ≈ ${Math.round((u.chars||0)/4).toLocaleString("fr-FR")} tokens fournis · dernière lecture le ${new Date(u.last*1000).toLocaleDateString("fr-FR")}`:"jamais lue par un agent"};
async function skLoad(){SK.loading=true;try{const r=await api("GET","/api/skills");SK.items=r.items;SK.facets=r.facets;SK.loaded=true;SK.msg=""}catch(e){SK.msg=e.message}SK.loading=false;render()}
function skMatch(s){const f=SKF;if(f.state=="on"&&!s.enabled||f.state=="off"&&s.enabled||f.state=="upd"&&SK.upd[s.id]!="update"||f.state=="pend"&&s.review!="pending")return false;
  for(const k of["domain","subdomain","language","functional"])if(f[k]&&!skArr(s[k]).includes(f[k]))return false;
  if(f.q){const t=(s.name+" "+s.description+" "+skArr(s.tags).join(" ")).toLowerCase();if(!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w)))return false}return true}
function skSel(k,label,lab){const o=Object.entries(SK.facets[k]||{}).sort((a,b)=>b[1]-a[1]);return `<select data-skf="${k}"><option value="">${label} : tous</option>${o.map(([v,n])=>`<option value="${esc(v)}"${SKF[k]==v?" selected":""}>${esc(lab(v))} (${n})</option>`).join("")}</select>`}
function skillsView(){
  const L=SK.items.filter(skMatch),n=SK.items.length,upd=Object.values(SK.upd).filter(x=>x=="update").length;
  const groups={};L.forEach(s=>(groups[s.domain||""]=groups[s.domain||""]||[]).push(s));
  const card=s=>{const pend=s.review=="pending",src=s.source||{};return `<div class="card"><div class="row" style="margin:0;justify-content:space-between"><b>${esc(s.name)}</b><span>${pend?'<span class="tag wa">à valider</span>':s.enabled?'<span class="tag ok">active</span>':'<span class="tag">désactivée</span>'}${SK.upd[s.id]=="update"?' <span class="tag wa">mise à jour</span>':""}</span></div>
    <div class="mu">${esc(skFormat[s.format]||"skill")} · ${src.type=="agent"?"proposée par "+esc(src.by)+" ("+esc(skName(D.projects,src.project))+")":esc(skSrc(s))}</div><p>${esc((s.description||"(pas de résumé)").slice(0,240))}${(s.description||"").length>240?"…":""}</p>
    <div>${skArr(s.subdomain).map(x=>`<span class="tag">${esc(skSub(x))}</span>`).join(" ")} ${skArr(s.language).map(x=>`<span class="tag">${esc(x)}</span>`).join(" ")} ${skArr(s.functional).map(x=>`<span class="tag">⚙ ${esc(x)}</span>`).join(" ")}</div>
    ${pend?"":`<div class="mu" style="margin-top:6px">Disponible pour : ${skScopeTxt(s)}</div><div class="mu">${skUsage(s)}</div>`}
    ${(s.warnings||[]).length?`<div class="mu" style="margin-top:6px" title="${esc(s.warnings.join("\n"))}">⚠ ${s.warnings.length} avertissement(s) — voir le détail</div>`:""}
    <div class="row" style="margin:8px 0 0">${pend?`<button class="b" data-sk="review" data-i="${s.id}">Examiner et approuver</button><button class="g d" data-sk="del" data-i="${s.id}">Refuser</button>`
    :`<button class="g" data-sk="view" data-i="${s.id}">Voir</button><button class="g" data-sk="toggle" data-i="${s.id}">${s.enabled?"Désactiver":"Activer"}</button><button class="g" data-sk="scope" data-i="${s.id}">Portée</button><button class="g" data-sk="update" data-i="${s.id}">Mettre à jour</button><button class="g" data-sk="meta" data-i="${s.id}">Catégories</button><button class="g d" data-sk="del" data-i="${s.id}">Désinstaller</button>`}</div></div>`};
  return `<h2>Skills</h2><div class="mu" style="margin-bottom:10px">Une skill est une fiche de méthode (markdown, point d'entrée <code>SKILL.md</code>) que les agents consultent à la demande, ciblée par catégorie ou par mots-clés, sans tout charger. Elles sont stockées dans <code>data/skills/${esc(U)}/</code>. Une skill reste une aide : elle ne prime jamais sur les règles du projet ni sur vos instructions, et ses scripts ne sont jamais exécutés. <b>Une skill venue d'un dépôt ou proposée par un agent reste « à valider » (invisible des agents) tant que vous ne l'avez pas approuvée.</b></div>
  <div class="row"><button class="b" data-sk="add">Ajouter des skills</button><button class="g" data-sk="check">Vérifier les mises à jour</button><span class="mu">${n} installée(s), ${SK.items.filter(s=>s.enabled).length} active(s)${upd?` · <b>${upd} mise(s) à jour disponible(s)</b>`:""}</span></div>
  ${SK.msg?`<div style="color:var(--er);margin:6px 0">${esc(SK.msg)}</div>`:""}
  <div class="row"><input id="skq" placeholder="Rechercher (nom, résumé, mots-clés)" value="${esc(SKF.q)}" style="min-width:220px">${skSel("domain","Domaine",skDom)}${skSel("subdomain","Sous-domaine",skSub)}${skSel("language","Langage",x=>x)}${skSel("functional","Fonction",x=>x)}
  <select data-skf="state"><option value="">État : tous</option><option value="on"${SKF.state=="on"?" selected":""}>actives</option><option value="off"${SKF.state=="off"?" selected":""}>désactivées</option><option value="upd"${SKF.state=="upd"?" selected":""}>à mettre à jour</option><option value="pend"${SKF.state=="pend"?" selected":""}>à valider</option></select><button class="g" data-sk="reset">Réinitialiser</button></div>
  ${!SK.loaded?'<div class="mu">Chargement…</div>':!n?'<div class="mu" style="margin-top:12px">Aucune skill installée. Utilisez « Ajouter des skills » : import d\'un fichier (.md, .zip, .skill) ou d\'un dépôt GitHub.</div>':!L.length?'<div class="mu" style="margin-top:12px">Aucune skill ne correspond à ces filtres.</div>':""}
  ${Object.keys(groups).sort((a,b)=>skDom(a).localeCompare(skDom(b))).map(d=>`<h3>${esc(skDom(d))} <span class="mu">(${groups[d].length})</span></h3><div class="grid">${groups[d].map(card).join("")}</div>`).join("")}`;
}
function skBind(){
  document.querySelectorAll("main [data-sk]").forEach(b=>b.onclick=()=>skAct(b.dataset.sk,b.dataset.i));
  document.querySelectorAll("main [data-skf]").forEach(s=>s.onchange=()=>{SKF[s.dataset.skf]=s.value;render()});
  const q=$("#skq");if(q)q.oninput=()=>{SKF.q=q.value;render()};
}
const skClose=()=>{$("#mod").style.display="none"};
function skModal(h){$("#mb").innerHTML=`<div style="min-width:min(720px,88vw);max-height:84vh;overflow:auto">${h}</div>`;$("#mod").style.display="flex"}
const skB64=buf=>{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const skStat={installed:"installée",updated:"mise à jour",unchanged:"déjà à jour",pinned:"déjà installée, version épinglée (utilisez « Mettre à jour » pour relire les changements)",error:"échec"};
async function skAct(a,id){
  const s=SK.items.find(x=>x.id==id);
  try{
    if(a=="add")return skImport();
    if(a=="reset"){SKF={q:"",domain:"",subdomain:"",language:"",functional:"",state:""};return render()}
    if(a=="toggle"){await api("POST","/api/skills/toggle",{id,enabled:!s.enabled});s.enabled=!s.enabled;return render()}
    if(a=="del"){if(!confirm("Désinstaller la skill « "+s.name+" » ? Ses fichiers seront supprimés."))return;await api("POST","/api/skills/uninstall",{id});return skLoad()}
    if(a=="check"){const r=await api("POST","/api/skills/check_updates",{});SK.upd=r.updates;const n=Object.values(r.updates).filter(x=>x=="update").length,e=Object.values(r.updates).filter(x=>x=="error"||x=="missing").length;SK.msg="";alert(n?n+" mise(s) à jour disponible(s) (filtre « à mettre à jour »).":"Toutes les skills issues d'un dépôt sont à jour."+(e?"\n"+e+" n'ont pas pu être vérifiées (dépôt privé, supprimé ou limite GitHub atteinte).":""));return render()}
    if(a=="update"){if((s.source||{}).type!="git")return alert("Cette skill ne vient pas d'un dépôt : réimportez le fichier mis à jour (« Ajouter des skills »), elle sera remplacée en gardant son état et ses catégories.");
      const r=(await api("POST","/api/skills/update",{id,apply:false})).results[0];if(r.status=="unchanged")return alert("Skill « "+s.name+" » : déjà à jour (version épinglée identique au dépôt).");const p=r.preview;
      skModal(`<h3 style="margin-top:0">Mettre à jour « ${esc(s.name)} »</h3><div class="mu">Version épinglée : rien ne change tant que vous n'avez pas relu les différences et appliqué.</div>
      <div>${p.added.length?`Ajoutés : ${p.added.map(esc).join(", ")}<br>`:""}${p.removed.length?`Supprimés : ${p.removed.map(esc).join(", ")}<br>`:""}${p.changed.length?`Modifiés : ${p.changed.map(esc).join(", ")}`:""}</div>
      ${p.scripts?'<div style="color:var(--er);margin-top:6px">⚠ contient des scripts (jamais exécutés par l\'application)</div>':""}${(p.warnings||[]).map(w=>`<div style="color:var(--er);margin-top:4px">⚠ ${esc(w)}</div>`).join("")}
      <pre style="white-space:pre-wrap;max-height:42vh;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:8px">${esc(p.diff||"(SKILL.md inchangé)")}</pre>
      <div class="row" style="margin:14px 0 0;justify-content:flex-end"><button class="g" id="skx">Garder la version actuelle</button><button class="b" id="sko">Appliquer la mise à jour</button></div>`);
      $("#skx").onclick=skClose;$("#sko").onclick=async()=>{try{const q=await api("POST","/api/skills/update",{id,apply:true});skClose();alert("Skill « "+s.name+" » : "+(skStat[q.results[0].status]||q.results[0].status));skLoad()}catch(e){alert(e.message)}};return}
    if(a=="scope"){const chk=(n,list,sel)=>list.map(x=>`<label style="display:block"><input type="checkbox" class="sks_${n}" value="${esc(x.id)}"${(sel||[]).includes(x.id)?" checked":""}> ${esc(x.name)}</label>`).join("")||'<div class="mu">(aucun)</div>';
      skModal(`<h3 style="margin-top:0">Portée de « ${esc(s.name)} »</h3><div class="mu">Cochez les projets et les rôles pour lesquels la skill est disponible aux agents. Rien de coché = tous.</div>
      <b>Projets</b>${chk("p",D.projects,(s.scope||{}).projects)}<b style="display:block;margin-top:8px">Rôles (disponible pour)</b>${chk("r",D.roles,(s.scope||{}).roles)}
      <b style="display:block;margin-top:8px">Imposée aux rôles</b><div class="mu">Ces agents reçoivent « lis cette skill avant de commencer » au début de chaque tâche.</div>${chk("q",D.roles,s.required_roles)}
      <div class="row" style="margin:16px 0 0;justify-content:flex-end"><button class="g" id="skx">Annuler</button><button class="b" id="sko">Enregistrer</button></div>`);
      const v=n=>[...document.querySelectorAll(".sks_"+n+":checked")].map(c=>c.value);$("#skx").onclick=skClose;$("#sko").onclick=async()=>{try{await api("POST","/api/skills/scope",{id,projects:v("p"),roles:v("r"),required_roles:v("q")});skClose();skLoad()}catch(e){alert(e.message)}};return}
    if(a=="review"){const g=await api("GET","/api/skills/get?id="+encodeURIComponent(id)),o=g.source||{};
      skModal(`<h3 style="margin-top:0">Examiner « ${esc(g.name)} »</h3><div class="mu">${o.type=="agent"?"Proposée par <b>"+esc(o.by)+"</b> dans le projet « "+esc(skName(D.projects,o.project))+" »"+(o.why?" — "+esc(o.why):""):"Source : "+esc(skSrc(g))} · ${g.files} fichier(s) · ${Math.round(g.size/1024*10)/10} Ko</div>
      <p><b>Ce que dit la skill :</b> ${esc(g.description)}</p>${g.headings.length?`<div><b>Sections :</b> ${g.headings.map(esc).join(" · ")}</div>`:""}
      <div class="mu" style="margin-top:6px">${g.scripts?"⚠ Contient des scripts : l'application ne les exécute jamais.":"Aucun script."} Une fois approuvée, elle sera disponible pour : ${skScopeTxt(g)} (modifiable ensuite par « Portée »).</div>
      ${(g.warnings||[]).map(w=>`<div style="color:var(--er);margin-top:4px">⚠ ${esc(w)}</div>`).join("")}<div class="mu" style="margin-top:8px">Fichiers : ${g.file_list.map(esc).join(", ")}</div>
      <pre style="white-space:pre-wrap;max-height:40vh;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:8px">${esc(g.text)}</pre>
      <div class="row" style="margin:14px 0 0;justify-content:flex-end"><button class="g" id="skx">Plus tard</button><button class="g d" id="skr">Refuser (supprimer)</button><button class="b" id="sko">Approuver</button></div>`);
      $("#skx").onclick=skClose;$("#skr").onclick=async()=>{if(!confirm("Supprimer cette skill ?"))return;try{await api("POST","/api/skills/uninstall",{id});skClose();skLoad()}catch(e){alert(e.message)}};$("#sko").onclick=async()=>{try{await api("POST","/api/skills/approve",{id});skClose();skLoad()}catch(e){alert(e.message)}};return}
    if(a=="view"){const g=await api("GET","/api/skills/get?id="+encodeURIComponent(id));
      return skModal(`<h3 style="margin-top:0">${esc(g.name)}</h3><div class="mu">${esc(skFormat[g.format]||"skill")} · ${esc(skSrc(g))} · ${g.files} fichier(s) · ${Math.round(g.size/1024*10)/10} Ko</div><p>${esc(g.description)}</p>
      <div>${[g.domain].concat(skArr(g.subdomain),skArr(g.language),skArr(g.functional)).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join(" ")}</div>
      ${(g.warnings||[]).map(w=>`<div style="color:var(--er);margin-top:6px">⚠ ${esc(w)}</div>`).join("")}
      <div class="mu" style="margin-top:8px">Fichiers : ${g.file_list.map(esc).join(", ")}</div>
      <pre style="white-space:pre-wrap;max-height:46vh;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:8px">${esc(g.text)}</pre><div class="row" style="justify-content:flex-end"><button class="g" id="skx">Fermer</button></div>`),$("#skx").onclick=skClose}
    if(a=="meta"){const v=k=>esc(skArr(s[k]).join(", "));
      skModal(`<h3 style="margin-top:0">Catégories de « ${esc(s.name)} »</h3><div class="mu">Vos corrections sont conservées lors des mises à jour. Séparez les valeurs par des virgules.</div>
      <label>Domaine (ex. coding, devops, data, docs, security, design…)</label><input id="skm_domain" value="${esc(s.domain||"")}"><label>Sous-domaine (ex. backend, frontend, integration, database, testing…)</label><input id="skm_subdomain" value="${v("subdomain")}">
      <label>Langage (ex. python, typescript, java…)</label><input id="skm_language" value="${v("language")}"><label>Fonction (ex. review, generate, debug, refactor, deploy…)</label><input id="skm_functional" value="${v("functional")}"><label>Mots-clés</label><input id="skm_tags" value="${v("tags")}">
      <div class="row" style="margin:16px 0 0;justify-content:flex-end"><button class="g" id="skx">Annuler</button><button class="b" id="sko">Enregistrer</button></div>`);
      $("#skx").onclick=skClose;$("#sko").onclick=async()=>{const f={};["domain","subdomain","language","functional","tags"].forEach(k=>f[k]=$("#skm_"+k).value);try{await api("POST","/api/skills/meta",{id,fields:f});skClose();skLoad()}catch(e){alert(e.message)}}}
  }catch(e){alert(e.message)}
}
function skImport(){
  skModal(`<h3 style="margin-top:0">Ajouter des skills</h3>
  <b>1. Importer un fichier</b><div class="mu">Fichier <code>.md</code> / <code>.mdc</code> (une skill), ou archive <code>.zip</code> / <code>.skill</code> (une ou plusieurs skills avec leurs fichiers annexes).</div>
  <div class="row"><input type="file" id="skfile" multiple accept=".md,.mdc,.markdown,.txt,.zip,.skill"><button class="b" id="skimp">Importer</button></div>
  <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><b>2. Depuis un dépôt git (GitHub)</b><div class="mu">Les skills installées depuis un dépôt arrivent « à valider » : vous les approuvez dans la liste avant que les agents puissent les lire. Dépôt, dossier (<code>…/tree/main/.agents/skills</code>) ou page de sujet (<code>github.com/topics/claude-code-skills</code> : liste les dépôts à explorer).</div>
  <input id="skurl" placeholder="https://github.com/compte/depot"><input id="sktok" type="password" placeholder="Jeton GitHub (facultatif : dépôt privé ou limite de débit ; transmis à GitHub, jamais conservé)" autocomplete="off">
  <div class="row"><button class="b" id="skls">Lister les skills</button></div><div id="skres"></div><div id="skmsg" class="mu" style="margin-top:8px;white-space:pre-wrap"></div>
  <div class="row" style="justify-content:flex-end;margin-bottom:0"><button class="g" id="skx">Fermer</button></div>`);
  const msg=t=>{$("#skmsg").textContent=t},rep=r=>r.map(x=>(x.status=="error"?"✗ ":"✓ ")+x.name+" — "+(skStat[x.status]||x.status)+(x.review=="pending"?" — à valider dans la liste (menu Skills)":"")+(x.error?" : "+x.error:"")).join("\n");
  $("#skx").onclick=skClose;
  $("#skimp").onclick=async()=>{const fs=[...$("#skfile").files];if(!fs.length)return msg("Choisissez un ou plusieurs fichiers.");let out=[];msg("Import en cours…");
    for(const f of fs){try{const r=await api("POST","/api/skills/import",{filename:f.name,data:skB64(await f.arrayBuffer())});out.push(rep(r.results))}catch(e){out.push("✗ "+f.name+" : "+e.message)}}
    msg(out.join("\n"));skLoad()};
