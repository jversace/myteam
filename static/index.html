<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier d’agents IA</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--sf:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d9dde3;--ac:#3b5bdb;--ac2:#e7ecff;--ok:#2b8a3e;--wa:#e8590c;--er:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--sf:#1d2128;--tx:#e8eaed;--mu:#9aa3b0;--bd:#323944;--ac:#7c93ff;--ac2:#273055;--ok:#69db7c;--wa:#ffa94d;--er:#ff8787}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--sf:#1d2128;--tx:#e8eaed;--mu:#9aa3b0;--bd:#323944;--ac:#7c93ff;--ac2:#273055;--ok:#69db7c;--wa:#ffa94d;--er:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--sf);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
nav h1{font-size:15px;margin:0 6px 10px}nav .sec{font-size:11px;color:var(--mu);text-transform:uppercase;margin:12px 8px 2px}
nav button{text-align:left;border:0;background:none;color:var(--tx);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{flex:1;padding:20px;min-width:0;overflow-x:auto}
h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 8px;font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--mu);padding:8px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
button.b,.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.g{background:none;color:var(--ac);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button.d{color:var(--er)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row input{width:auto;flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mu)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--ac2);color:var(--ac)}
.tag.ok{color:var(--ok)}.tag.wa{color:var(--wa)}.tag.er{color:var(--er)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.task{margin-left:0;border-left:2px solid var(--bd);padding-left:10px;margin-top:6px}
.tr{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;flex-wrap:wrap}.tr .t{flex:1;min-width:140px}.tr select{width:auto}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#mod>div{background:var(--sf);border-radius:12px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
#mod label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
#login{max-width:340px;margin:12vh auto;padding:0 16px}#login .card{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
@media(max-width:700px){#app{flex-direction:column}nav{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--bd)}nav .sec{display:none}}
</style></head><body>
<div id="root"></div><div id="mod"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


let D=null,U=null,TOK=null,view="dash",pid=null,tab="glob",q="",err="";
try{TOK=localStorage.getItem("apm_tok");U=localStorage.getItem("apm_user")}catch(e){}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:Object.assign({"Content-Type":"application/json"},TOK?{Authorization:"Bearer "+TOK}:{}),body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||r.statusText);e.status=r.status;e.data=j;throw e}return j}
async function loadState(){const r=await api("GET","/api/state");REV=r.rev;SER=r.ser;const d=r.state;if(!d||!d.projects)return fresh();d.projects.forEach(ensure);let mg=false;(d.services||[]).forEach(s=>{if(s.model=="gemini-2.0-flash"){s.model="gemini-3.8-flash";mg=true}});if(mg)setTimeout(save,0);return d}
const uid=()=>Math.random().toString(36).slice(2,9);
let st=null,ver=0,REV=0,SER=0,saving=false;
const modalOpen=()=>$("#mod").style.display=="flex";
function adopt(r){REV=r.rev;SER=r.ser;if(JSON.stringify(r.state)!=JSON.stringify(D)){D=r.state;D.projects.forEach(ensure);render()}}
async function put(){const v=ver;saving=true;try{const r=await api("PUT","/api/state",{rev:REV,state:D});if(v==ver&&!modalOpen())adopt(r)}catch(e){if(e.status==401)logout()}saving=false}
function save(){ver++;clearTimeout(st);st=setTimeout(()=>{st=null;put()},300)}
async function flush(){clearTimeout(st);st=null;await put()}
async function poll(){if(!TOK||!D||st||saving||modalOpen())return;const v=ver;try{const r=await api("GET","/api/state?ser="+SER);if(r.same||st||saving||v!=ver||modalOpen())return;REV=r.rev;SER=r.ser;D=r.state;D.projects.forEach(ensure);render()}catch(e){if(e.status==401)logout()}}
setInterval(poll,2000);
async function job(o){try{await flush();await api("POST","/api/job",Object.assign({projectId:pid},o));setTimeout(poll,500)}catch(e){alert(e.message)}}

const CAPS=[["subtask","Créer des sous-tâches (sous ses propres tâches)","sous-tâches"],["task_top","Créer des tâches de 1er niveau","1er niveau"],["module","Créer des modules","modules"],["bug","Déclarer des bugs","bugs"],["bug_update","Faire évoluer les bugs (en correction, corrigé)","évolution bugs"],["bug_verify","Vérifier / rouvrir un bug","vérification"],["link","Rattacher aux modules","liens modules"]];
const LV={free:"✔ libre",approve:"✋ soumis à validation",no:"— interdit"},AUT={prudent:"Prudent",balanced:"Équilibré",auto:"Autonome"};
const DEF_BASE={subtask:"free",task_top:"no",module:"no",bug:"free",bug_update:"free",bug_verify:"no",link:"free"};  // à garder synchronisé avec DEFAULT_CAPS de rights.py
const DEF_CAPS={"Chef de projet":{...DEF_BASE,task_top:"approve",module:"approve",bug_verify:"free"},"Architecte":{...DEF_BASE,task_top:"approve",module:"approve",bug_verify:"free"},"Testeur QA":{...DEF_BASE,task_top:"approve",bug_verify:"free"},"Rédacteur technique":{...DEF_BASE,bug:"no",bug_update:"no"}};
const NAMES=["Camille","Louis","Inès","Hugo","Jade","Noah","Léna","Adam","Zoé","Théo","Maëlle","Axel","Éva","Malo","Lucie","Nils"];
const ROLES=[["Chef de projet","Planifie, priorise, coordonne l’équipe et rend compte de l’avancement."],["Architecte","Définit l’architecture technique et les standards de code."],["Développeur back-end","Implémente la logique métier, les API et la base de données."],["Développeur front-end","Réalise l’interface et l’expérience utilisateur."],["Testeur QA","Rédige et exécute les tests, qualifie et remonte les bugs."],["DevOps","Gère l’intégration continue, le déploiement et l’infrastructure."],["Rédacteur technique","Rédige la documentation et les notes de version."]];
const SERV=[["Claude","https://api.anthropic.com/v1","Raisonnement, code long, respect des consignes","Quota de tokens à surveiller","anthropic","claude-sonnet-4-6"],["Mistral","https://api.mistral.ai/v1","Rapide, bon en français, coût maîtrisé","Moins solide sur les très gros contextes","openai","mistral-large-latest"],["ChatGPT","https://api.openai.com/v1","Polyvalent, large écosystème d’outils","Verbosité, coût variable","openai","gpt-4o"],["Gemini","https://generativelanguage.googleapis.com/v1beta/openai","Très grand contexte, multimodal","Régularité variable sur le code","openai","gemini-3.8-flash"],["DeepSeek","https://api.deepseek.com","Excellent rapport qualité/prix en code","Disponibilité parfois limitée","openai","deepseek-chat"]];
function fresh(){return{services:SERV.map(s=>({id:uid(),name:s[0],url:s[1],account:"",pros:s[2],cons:s[3],kind:s[4],model:s[5],apiKey:""})),projects:[]}}
function newProject(name){return{id:uid(),name,open:true,desc:"",rules:"",spec:"",mainId:"",repo:{url:"",branch:"main",token:""},autonomy:"balanced",roles:ROLES.map(r=>({id:uid(),name:r[0],desc:r[1],caps:{...(DEF_CAPS[r[0]]||DEF_BASE)}})),agents:[],tasks:[],bugs:[],modules:[],log:[],commits:[],releases:[],mrs:[]}}
function ensure(p){p.repo=Object.assign({url:"",branch:"main",token:""},p.repo||{});["agents","tasks","bugs","modules","log","commits","releases","mrs","roles"].forEach(k=>{p[k]=p[k]||[]});p.rules=p.rules||"";p.spec=p.spec||"";p.workflows=p.workflows||[];p.autonomy=p.autonomy||"balanced";p.roles.forEach(r=>{if(!r.caps)r.caps={...(DEF_CAPS[r.name]||DEF_BASE)}});
  p.agents.forEach(a=>{if(a.token&&!p.repo.token)p.repo.token=a.token;if(a.repo&&!p.repo.url)p.repo.url=a.repo;delete a.token;delete a.repo;delete a.dir;a.history=a.history||[];a.notes=a.notes||"";a.talk=a.talk||[];a.branch=a.branch||"agent/"+a.name.toLowerCase()});
  if(!p.mainId&&p.agents[0])p.mainId=p.agents[0].id;p.tasks.forEach(t=>{t.modules=t.modules||[]});p.bugs.forEach(b=>{b.modules=b.modules||[]})}
const P=()=>D.projects.find(p=>p.id===pid);
const ag=(p,id)=>p.agents.find(a=>a.id===id);
function prog(p){const t=p.tasks.length;return t?Math.round(100*p.tasks.filter(x=>x.status==="terminée").length/t):0}
function modal(title,fields,cb,okLabel){
  const h=fields.map(f=>f.info?`<div class="mu" style="margin-top:8px">${f.info}</div>`:`<label>${esc(f.l)}</label>`+(f.opts?`<select data-k="${f.k}"${f.multi?" multiple size=4":""}>${f.opts.map(o=>`<option value="${esc(o[0])}"${(f.multi?(f.v||[]).includes(o[0]):o[0]==f.v)?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`:f.area?`<textarea data-k="${f.k}" rows="${f.rows||3}">${esc(f.v||"")}</textarea>`:`<input data-k="${f.k}" type="${f.type||"text"}" value="${esc(f.v||"")}">`)).join("");
  $("#mb").innerHTML=`<h3 style="margin-top:0">${esc(title)}</h3>${h}<div class="row" style="margin:16px 0 0;justify-content:flex-end"><button class="g" id="mc">Annuler</button><button class="b" id="mo">${okLabel||"Valider"}</button></div>`;
  $("#mod").style.display="flex";
  $("#mc").onclick=()=>$("#mod").style.display="none";
  $("#mo").onclick=()=>{const o={};document.querySelectorAll("#mb [data-k]").forEach(e=>o[e.dataset.k]=e.multiple?[...e.selectedOptions].map(x=>x.value):e.value);$("#mod").style.display="none";cb(o);save();render()};
}
function login(){
  $("#root").innerHTML=`<div id="login"><div class="card"><h2 style="margin:0">Atelier d’agents IA</h2><span class="mu">Connectez-vous ou créez un compte (les données restent sur cet appareil).</span><input id="u" placeholder="Identifiant" autocomplete="username"><input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password"><div style="color:var(--er)">${esc(err)}</div><button class="b" id="in">Connexion</button><button class="g" id="cr">Créer le compte</button></div></div>`;
  const go=async mk=>{const u=$("#u").value.trim(),p=$("#p").value;if(!u||!p){err="Identifiant et mot de passe requis.";return login()}
    try{const r=await api("POST",mk?"/api/register":"/api/login",{user:u,password:p});TOK=r.token;U=u;try{localStorage.setItem("apm_tok",TOK);localStorage.setItem("apm_user",U)}catch(e){}D=await loadState();if(mk)save();err="";render()}catch(e){err=e.message;login()}};
  $("#in").onclick=()=>go(false);$("#cr").onclick=()=>go(true);
}
function logout(){clearTimeout(st);api("POST","/api/logout").catch(()=>{});TOK=U=D=null;pid=null;view="dash";try{localStorage.removeItem("apm_tok");localStorage.removeItem("apm_user")}catch(e){}login()}
function render(){
  if(!U)return login();
  const open=D.projects.filter(p=>p.open);
  let nav=`<nav><h1>Atelier d’agents IA</h1><button data-v="dash" class="${view=="dash"?"on":""}">Tableau de bord</button><button data-v="proj" class="${view=="proj"?"on":""}">Projets</button><button data-v="serv" class="${view=="serv"?"on":""}">Services IA</button><div class="sec">Projets ouverts</div>`+open.map(p=>`<button data-p="${p.id}" class="${view=="p"&&pid==p.id?"on":""}">${esc(p.name)}${pendN(p)+(p.pending||[]).length?` <span class="tag wa">${pendN(p)+(p.pending||[]).length}</span>`:""}</button>`).join("")+`<div style="flex:1"></div><span class="mu" style="padding:0 8px">${esc(U)}</span><button id="lo">Déconnexion</button></nav>`;
  let body=view=="dash"?dash():view=="proj"?projects():view=="serv"?services():projView();
  const keep={},ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart;document.querySelectorAll("[data-keep]").forEach(e=>{keep[e.id]=e.value});const sc={};document.querySelectorAll("[data-scroll]").forEach(e=>{sc[e.id]={t:e.scrollTop,b:e.scrollHeight-e.scrollTop-e.clientHeight<40}});
  $("#root").innerHTML=`<div id="app">${nav}<main>${body}</main></div>`;
  Object.keys(keep).forEach(i=>{const e=document.getElementById(i);if(e)e.value=keep[i]});document.querySelectorAll("[data-scroll]").forEach(e=>{const o=sc[e.id];e.scrollTop=(!o||o.b)?e.scrollHeight:o.t});const fe=fid&&document.getElementById(fid);if(fe){fe.focus();try{if(fs!=null)fe.setSelectionRange(fs,fs)}catch(e){}}
  document.querySelectorAll("nav [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  document.querySelectorAll("nav [data-p]").forEach(b=>b.onclick=()=>{pid=b.dataset.p;view="p";tab="glob";render()});
  $("#lo").onclick=logout;bind();
}
function bind(){document.querySelectorAll("main [data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i,b.dataset.j));
  document.querySelectorAll("main [data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  document.querySelectorAll("main select[data-s]").forEach(s=>s.onchange=()=>{const p=P();const t=p.tasks.find(x=>x.id==s.dataset.i)||p.bugs.find(x=>x.id==s.dataset.i);t[s.dataset.s]=s.value;save();render()});
  ["ci","gi"].forEach(i=>{const e=$("#"+i);if(e)e.onkeydown=ev=>{if(ev.key=="Enter"){const b=document.querySelector(`[data-j="${i}"]`);if(b)b.click()}}});const s=$("#sq");if(s)s.oninput=()=>{q=s.value;render();const n=$("#sq");n.focus();n.setSelectionRange(q.length,q.length)}}
function dash(){
  const open=D.projects.filter(p=>p.open);
  const ags=open.reduce((n,p)=>n+p.agents.length,0),bugs=open.reduce((n,p)=>n+p.bugs.filter(b=>bugOpen(b)).length,0),susp=open.reduce((n,p)=>n+p.agents.filter(a=>a.state=="suspendu").length,0);
  return `<h2>Tableau de bord</h2><div class="grid" style="margin-bottom:18px"><div class="card"><div class="big">${open.length}</div><div class="mu">projets ouverts</div></div><div class="card"><div class="big">${ags}</div><div class="mu">agents actifs (dont ${susp} suspendus)</div></div><div class="card"><div class="big">${bugs}</div><div class="mu">bugs non résolus</div></div><div class="card"><div class="big">${D.services.length}</div><div class="mu">services IA</div></div><div class="card"><div class="big">${fmt$(open.reduce((n,p)=>n+((p.usage||{}).cost||0),0))}</div><div class="mu">coût API estimé (projets ouverts)</div></div><div class="card"><div class="big">${open.reduce((n,p)=>n+pendN(p),0)}</div><div class="mu">décisions en attente</div></div></div>`+(open.length?`<div class="grid">`+open.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="bar"><i style="width:${prog(p)}%"></i></div><div class="mu">${prog(p)} % · ${p.tasks.length} tâches · ${p.agents.length} agents · ${p.bugs.filter(b=>bugOpen(b)).length} bugs · ${p.releases.length} releases</div><div style="margin-top:8px"><button class="g" data-a="go" data-i="${p.id}">Ouvrir</button></div></div>`).join("")+`</div>`:`<div class="card">Aucun projet ouvert. Créez-en un dans l’onglet Projets.</div>`);
}
function projects(){
  const l=D.projects.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  return `<h2>Projets</h2><div class="row"><input id="sq" placeholder="Rechercher un projet…" value="${esc(q)}"><button class="b" data-a="newp">Nouveau projet</button></div><table><tr><th>Nom</th><th>État</th><th>Avancement</th><th></th></tr>`+l.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mu">${esc(p.desc)}</div></td><td><span class="tag ${p.open?"ok":""}">${p.open?"ouvert":"fermé"}</span></td><td>${prog(p)} %</td><td><button class="g" data-a="go" data-i="${p.id}">Ouvrir</button> <button class="g" data-a="tog" data-i="${p.id}">${p.open?"Fermer":"Rouvrir"}</button> <button class="g d" data-a="delp" data-i="${p.id}">Supprimer</button></td></tr>`).join("")+(l.length?"":`<tr><td colspan="4" class="mu">Aucun résultat.</td></tr>`)+`</table>`;
}
function services(){
  return `<h2>Services IA</h2><div class="row"><button class="b" data-a="news">Ajouter un service</button></div><div class="grid">`+D.services.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="mu">${esc(s.url)}</div><div class="mu">Compte : ${esc(s.account||"—")} · modèle ${esc(s.model||"—")} · clé ${s.apiKey?"définie":"manquante"} · tarif ${price(s)?esc((s.pin||0)+" / "+(s.pout||0))+" $ par M tokens":"non renseigné"}</div><p><span class="tag ok">Forts</span> ${esc(s.pros)}</p><p><span class="tag er">Faibles</span> ${esc(s.cons)}</p><button class="g" data-a="keyset" data-i="${s.id}">${s.apiKey?"Changer la clé":"Configurer la clé"}</button> <button class="g" data-a="tests" data-i="${s.id}">Tester</button> <button class="g" data-a="edits" data-i="${s.id}">Modifier</button> <button class="g d" data-a="dels" data-i="${s.id}">Révoquer</button></div>`).join("")+`</div>`;
}
let chatAg=null,hf="all",rk="f";
const now=()=>new Date().toLocaleString("fr-FR");
const NA=["Vous","Système","Application"];
const isMain=(p,a)=>p.mainId==a.id,mainAgent=p=>p.agents.find(a=>a.id==p.mainId);
const role=(p,a)=>p.roles.find(r=>r.id==a.role)||{name:"—",desc:""};
const modNames=(p,ids)=>(ids||[]).map(i=>(p.modules.find(m=>m.id==i)||{}).name).filter(Boolean);
const modIds=(p,v)=>(v||[]).map(x=>(p.modules.find(m=>m.id==x||m.name.toLowerCase()==String(x).toLowerCase())||{}).id).filter(Boolean);
const mtags=(p,ids)=>modNames(p,ids).map(n=>`<span class="tag">${esc(n)}</span>`).join(" ");
function log(p,from,to,text){p.log.push({d:now(),from,to,text})}
function chatBox(p,a,n){const L=p.log.filter(m=>(m.from=="Vous"&&m.to==a.name)||(m.to=="Vous"&&m.from==a.name)||(m.from=="Système"&&m.to==a.name)).slice(-n);
  return `<div class="card" id="cb-${a.id}-${n}" data-scroll style="max-height:340px;overflow:auto">${L.map(m=>`<div style="margin-bottom:8px"><b>${esc(m.from)}</b> <span class="mu">${esc(m.d)}</span><div style="white-space:pre-wrap">${esc(m.text)}</div></div>`).join("")||`<span class="mu">Aucun message.</span>`}${(a.work||0)>0?`<div class="mu">⏳ ${esc(a.name)} travaille…</div>`:""}</div>`}

function recap(p,k){const L=[],pct=ts=>ts.length?Math.round(100*ts.filter(t=>t.status=="terminée").length/ts.length):0,ob=p.bugs.filter(b=>bugOpen(b));
